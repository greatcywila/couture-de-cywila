# ========================================================
# Netlify Configuration for Couture dé Cywila Ecosystem
# ========================================================

[build]
  publish = "."
  functions = "netlify/functions"
  edge_functions = "netlify/edge-functions"

# Edge Function Subdomain Router
[[edge_functions]]
  path = "/*"
  function = "subdomain-router"

# API Route for Serverless Payment Config
[[redirects]]
  from = "/api/config"
  to = "/.netlify/functions/payment-config"
  status = 200

[[redirects]]
  from = "/api/payment-config"
  to = "/.netlify/functions/payment-config"
  status = 200

# API Route for Serverless Email Dispatcher (Resend)
[[redirects]]
  from = "/api/send-email"
  to = "/.netlify/functions/send-email"
  status = 200

# API Route for Persistent Real-Time Orders
[[redirects]]
  from = "/api/orders"
  to = "/.netlify/functions/orders"
  status = 200

# API Route for Cloud Customer Accounts & Auth
[[redirects]]
  from = "/api/customers"
  to = "/.netlify/functions/customers"
  status = 200

# API Route for Cloud Users & Staff Management
[[redirects]]
  from = "/api/users"
  to = "/.netlify/functions/users"
  status = 200

# API Route for Cloud Services & Plans Catalog
[[redirects]]
  from = "/api/catalog"
  to = "/.netlify/functions/catalog"
  status = 200

# API Route for Business Settings (VAT, Bank, WhatsApp)
[[redirects]]
  from = "/api/settings"
  to = "/.netlify/functions/settings"
  status = 200

# Global Security & Asset Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # CSP: Allows local inline scripts, Chart.js CDN, Flutterwave, Paystack, Resend & Google Fonts
    Content-Security-Policy = "default-src 'self' 'unsafe-inline' https:; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://checkout.flutterwave.com https://api.flutterwave.com https://js.paystack.co https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; frame-src 'self' https://checkout.flutterwave.com https://*.flutterwave.com https://js.paystack.co; connect-src 'self' https://*.flutterwave.com https://api.flutterwave.com https://api.paystack.co https://api.resend.com https://*.supabase.co;"

# Cache static CSS
[[headers]]
  for = "/style.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache images
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
