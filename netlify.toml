# ========================================================
# Netlify Configuration for Couture dé Cywila Ecosystem
# ========================================================

[build]
  publish = "."

# Global Security & Asset Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # CSP: Allows local inline scripts, Chart.js CDN, Flutterwave checkout & Google Fonts
    Content-Security-Policy = "default-src 'self' 'unsafe-inline' https:; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://checkout.flutterwave.com https://api.flutterwave.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; frame-src 'self' https://checkout.flutterwave.com https://*.flutterwave.com; connect-src 'self' https://*.flutterwave.com https://api.flutterwave.com;"

# Cache static CSS
[[headers]]
  for = "/style.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache images
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
